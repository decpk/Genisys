<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Genisys Remote Terminal</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <style>
      :root {
        --bg: #0b0e14;
        --panel: #11151f;
        --fg: #e6e6e6;
        --muted: #8b93a7;
        --accent: #4f9cf9;
        --accent-press: #3b82e0;
        --danger: #f97066;
        --border: #1e2536;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px calc(10px + env(safe-area-inset-top));
        padding-top: max(10px, env(safe-area-inset-top));
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      header .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        flex: 0 0 auto;
        transition: background 0.2s;
      }
      header .dot.live { background: #34d399; }
      header .dot.pending { background: #fbbf24; }
      header .dot.error { background: var(--danger); }
      header .title { font-weight: 600; }
      header .meta { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
      #terminal-wrap {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: var(--bg);
      }
      #terminal { position: absolute; inset: 0; padding: 6px; }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px;
        text-align: center;
        background: rgba(11, 14, 20, 0.94);
        backdrop-filter: blur(4px);
        z-index: 5;
      }
      #overlay.hidden { display: none; }
      #overlay h1 { font-size: 17px; margin: 0; font-weight: 600; }
      #overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 32ch; line-height: 1.5; }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .choices { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; }
      button.choice, button.action {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.05s;
      }
      button.choice:active, button.action:active { transform: scale(0.985); }
      button.choice .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-all; }
      button.action {
        text-align: center;
        background: var(--accent);
        border-color: var(--accent);
        color: #04122b;
        font-weight: 600;
        max-width: 360px;
        width: 100%;
      }
      button.action:active { background: var(--accent-press); }
      button.action.secondary { background: var(--panel); color: var(--fg); font-weight: 500; }
      .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      #tabbar {
        flex: 0 0 auto;
        display: none;
        align-items: stretch;
        gap: 4px;
        padding: 6px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        scrollbar-width: none;
      }
      #tabbar::-webkit-scrollbar { display: none; }
      .tab {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
        flex: 0 0 auto;
        max-width: 200px;
        overflow: hidden;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
      }
      .tab.active { background: var(--bg); color: var(--fg); border-color: var(--accent); }
      .tab.add { color: var(--accent); font-weight: 700; }
      .tab:active { transform: scale(0.97); }
      .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-close {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        margin-right: -4px;
        border-radius: 5px;
        font-size: 15px;
        line-height: 1;
        color: var(--muted);
        transition: background 0.12s, color 0.12s;
      }
      .tab-close:hover { background: var(--danger); color: #fff; }
      .hdr-btn {
        appearance: none;
        flex: 0 0 auto;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 7px;
        padding: 5px 9px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: color 0.12s, border-color 0.12s;
      }
      .hdr-btn.on { color: var(--accent); border-color: var(--accent); }
      #keybar {
        flex: 0 0 auto;
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 6px 8px;
        padding-bottom: calc(6px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-top: 1px solid var(--border);
      }
      #keybar.show { display: flex; }
      .keybar-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .keybar-row::-webkit-scrollbar { display: none; }
      .keybar-row button {
        appearance: none;
        flex: 1 1 0;
        min-width: 46px;
        min-height: 42px;
        padding: 0 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        border-radius: 9px;
        font-family: inherit;
        font-size: 15px;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        transition: background 0.1s, transform 0.05s;
      }
      .keybar-row button:active { background: var(--border); transform: scale(0.94); }
      .keybar-row button.accent {
        background: var(--accent);
        border-color: var(--accent);
        color: #04122b;
        font-weight: 600;
      }
      .keybar-row button.accent:active { background: var(--accent-press); }
      .keybar-row button.danger { color: var(--danger); }
      /* Floating scroll buttons — bottom-right of terminal, above the keybar */
      #scroll-fab {
        position: absolute;
        right: calc(10px + env(safe-area-inset-right));
        bottom: calc(10px + env(safe-area-inset-bottom));
        display: none;
        flex-direction: column;
        gap: 8px;
        z-index: 4;
      }
      #scroll-fab.show { display: flex; }
      .scroll-fab-btn {
        appearance: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--fg);
        font-size: 20px;
        line-height: 1;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        transition: background 0.1s, transform 0.05s;
      }
      .scroll-fab-btn:active { background: var(--border); transform: scale(0.92); }
      /* Always-visible terminal scrollback scrollbar (overrides vendored xterm.css) */
      .xterm .xterm-viewport {
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .xterm .xterm-viewport::-webkit-scrollbar {
        width: 10px;
      }
      .xterm .xterm-viewport::-webkit-scrollbar-track {
        background: transparent;
      }
      .xterm .xterm-viewport::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
        background-clip: padding-box;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="dot" id="dot"></span>
        <span class="title">Genisys Terminal</span>
        <span class="meta" id="meta"></span>
        <button
          class="hdr-btn"
          id="kb-toggle"
          type="button"
          title="Show / hide on-screen keys"
          aria-label="Toggle on-screen keys"
        >
          ⌨
        </button>
      </header>
      <div id="tabbar"></div>
      <div id="terminal-wrap">
        <div id="terminal"></div>
        <div id="overlay">
          <div class="spinner" id="spinner"></div>
          <h1 id="ov-title">Connecting…</h1>
          <p id="ov-text"></p>
          <div class="choices" id="choices" style="display: none"></div>
          <button class="action" id="ov-action" style="display: none"></button>
        </div>
        <div id="scroll-fab" aria-label="Scroll terminal">
          <button type="button" class="scroll-fab-btn" data-scroll="up" aria-label="Scroll up">↑</button>
          <button type="button" class="scroll-fab-btn" data-scroll="down" aria-label="Scroll down">↓</button>
        </div>
      </div>
      <div id="keybar" aria-label="On-screen keys">
        <div class="keybar-row">
          <button type="button" data-key="esc">Esc</button>
          <button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="up" aria-label="Up arrow">↑</button>
          <button type="button" data-key="down" aria-label="Down arrow">↓</button>
          <button type="button" data-key="left" aria-label="Left arrow">←</button>
          <button type="button" data-key="right" aria-label="Right arrow">→</button>
          <button type="button" data-key="ctrlc" class="danger" aria-label="Control C">⌃C</button>
        </div>
        <div class="keybar-row">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="y">y</button>
          <button type="button" data-key="n">n</button>
          <button type="button" data-key="enter" class="accent">⏎ Enter</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var TOKEN = new URLSearchParams(location.search).get("token") || "";
        // Persisted trust grant: lets a page reload skip the desktop approval
        // prompt until the grant expires (sliding 6h, issued by the server after
        // approval). Scoped to the current access token so a new share session
        // (new token) always re-prompts.
        var GRANT_KEY = "genisys.remote.grant";
        function loadGrant() {
          try {
            var raw = localStorage.getItem(GRANT_KEY);
            if (!raw) return "";
            var o = JSON.parse(raw);
            if (
              o &&
              o.token === TOKEN &&
              typeof o.grant === "string" &&
              o.grant &&
              typeof o.expiresAt === "number" &&
              o.expiresAt > Date.now()
            ) {
              return o.grant;
            }
          } catch (e) {}
          return "";
        }
        function saveGrant(grant, expiresAt) {
          try {
            localStorage.setItem(
              GRANT_KEY,
              JSON.stringify({ token: TOKEN, grant: grant, expiresAt: expiresAt })
            );
          } catch (e) {}
        }
        function clearGrant() {
          try {
            localStorage.removeItem(GRANT_KEY);
          } catch (e) {}
        }
        var TerminalCtor = window.Terminal;
        var FitAddonCtor =
          window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);

        var app = document.getElementById("app");
        var dot = document.getElementById("dot");
        var meta = document.getElementById("meta");
        var tabbar = document.getElementById("tabbar");
        var keybar = document.getElementById("keybar");
        var scrollFab = document.getElementById("scroll-fab");
        var kbToggle = document.getElementById("kb-toggle");
        var overlay = document.getElementById("overlay");
        var spinner = document.getElementById("spinner");
        var ovTitle = document.getElementById("ov-title");
        var ovText = document.getElementById("ov-text");
        var ovAction = document.getElementById("ov-action");

        var term = null;
        var fit = null;
        var ws = null;
        var approved = false;
        var activeId = null;
        var attaching = false;
        var sessions = [];
        var perms = { allowNewTab: true, allowCloseTab: false };
        var resizeTimer = null;

        // ---- base64 helpers (UTF-8 / binary safe) ----------------------------
        function toB64(str) {
          var bytes = new TextEncoder().encode(str);
          var bin = "";
          for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin);
        }
        function fromB64(b64) {
          var bin = atob(b64);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return arr;
        }

        // ---- overlay state machine ------------------------------------------
        function setDot(kind) {
          dot.className = "dot" + (kind ? " " + kind : "");
        }
        function showOverlay(opts) {
          overlay.classList.remove("hidden");
          spinner.style.display = opts.spinner ? "" : "none";
          ovTitle.textContent = opts.title || "";
          ovText.textContent = opts.text || "";
          if (opts.action) {
            ovAction.style.display = "";
            ovAction.textContent = opts.action.label;
            ovAction.className = "action" + (opts.action.secondary ? " secondary" : "");
            ovAction.onclick = opts.action.onClick;
          } else {
            ovAction.style.display = "none";
            ovAction.onclick = null;
          }
        }
        function hideOverlay() {
          overlay.classList.add("hidden");
        }

        // ---- terminal --------------------------------------------------------
        function ensureTerminal() {
          if (term) return;
          term = new TerminalCtor({
            cursorBlink: true,
            fontSize: 14,
            fontFamily:
              'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace',
            theme: { background: "#0b0e14", foreground: "#e6e6e6" },
            scrollback: 5000,
            macOptionIsMeta: true,
          });
          if (FitAddonCtor) {
            fit = new FitAddonCtor();
            term.loadAddon(fit);
          }
          term.open(document.getElementById("terminal"));
          term.onData(function (data) {
            send({ type: "input", data: toB64(data) });
          });
          doFit();
        }
        function doFit() {
          if (fit) {
            try { fit.fit(); } catch (e) {}
          }
        }
        function dims() {
          return { cols: (term && term.cols) || 80, rows: (term && term.rows) || 24 };
        }

        // ---- helpers ---------------------------------------------------------
        function basename(p) {
          if (!p) return "shell";
          var parts = p.split("/");
          return parts[parts.length - 1] || p;
        }
        function shortCwd(p) {
          var parts = p.split("/").filter(Boolean);
          return parts.length ? parts[parts.length - 1] : p;
        }

        // ---- tab bar ---------------------------------------------------------
        function renderTabs() {
          if (!approved) {
            tabbar.style.display = "none";
            return;
          }
          tabbar.style.display = "flex";
          tabbar.innerHTML = "";
          sessions.forEach(function (s) {
            var t = document.createElement("button");
            t.className = "tab" + (s.id === activeId ? " active" : "");
            t.title = s.cwd || s.shell;
            var label = document.createElement("span");
            label.className = "tab-label";
            label.textContent =
              s.title || basename(s.shell) + (s.cwd ? " — " + shortCwd(s.cwd) : "");
            t.appendChild(label);
            t.onclick = function () { switchTo(s.id); };
            if (perms.allowCloseTab) {
              var close = document.createElement("span");
              close.className = "tab-close";
              close.title = "Close tab";
              close.textContent = "×";
              close.onclick = function (e) {
                e.stopPropagation();
                closeTab(s.id);
              };
              t.appendChild(close);
            }
            tabbar.appendChild(t);
          });
          if (perms.allowNewTab) {
            var add = document.createElement("button");
            add.className = "tab add";
            add.title = "New shell";
            add.textContent = "＋";
            add.onclick = function () { newShell(); };
            tabbar.appendChild(add);
          }
        }
        function switchTo(id) {
          // On touch devices, re-tapping the active tab must NOT focus xterm —
          // that would pop the mobile soft keyboard from a button press.
          if (id === activeId) { if (term && !isTouch) term.focus(); return; }
          var d = dims();
          send({ type: "switch", sessionId: id, cols: d.cols, rows: d.rows });
        }
        function newShell() {
          var d = dims();
          send({ type: "new", cols: d.cols, rows: d.rows });
        }
        function closeTab(id) {
          send({ type: "close_tab", sessionId: id });
        }

        // ---- on-screen keys --------------------------------------------------
        // Mobile soft keyboards lack arrows / Esc / Tab / Ctrl, so a remote user
        // mirroring an AI CLI (e.g. Claude Code) can't answer its
        // arrow-key selection menus. These buttons inject the matching VT/control
        // sequences through the existing `input` channel — the desktop PTY accepts
        // them verbatim (the same bytes a hardware key would produce).
        var KEY_SEQ = {
          up: "\u001b[A",
          down: "\u001b[B",
          right: "\u001b[C",
          left: "\u001b[D",
          enter: "\r",
          esc: "\u001b",
          tab: "\t",
          ctrlc: "\u0003",
        };
        function seqForKey(k) {
          return Object.prototype.hasOwnProperty.call(KEY_SEQ, k) ? KEY_SEQ[k] : k;
        }
        // Send WITHOUT focusing the terminal: focusing would summon the soft
        // keyboard, but a user tapping arrows to navigate a menu wants it closed.
        // PTY input is delivered regardless of xterm focus.
        function sendKey(seq) {
          if (!approved || activeId === null) return;
          send({ type: "input", data: toB64(seq) });
        }

        var KEYBAR_PREF_KEY = "genisys.remote.keybar";
        var isTouch =
          (typeof window.matchMedia === "function" &&
            window.matchMedia("(pointer: coarse)").matches) ||
          "ontouchstart" in window ||
          (navigator.maxTouchPoints || 0) > 0;
        function loadKeybarPref() {
          try {
            var v = localStorage.getItem(KEYBAR_PREF_KEY);
            if (v === "1") return true;
            if (v === "0") return false;
          } catch (e) {}
          return isTouch;
        }
        function saveKeybarPref(on) {
          try {
            localStorage.setItem(KEYBAR_PREF_KEY, on ? "1" : "0");
          } catch (e) {}
        }
        var keybarEnabled = loadKeybarPref();
        // The bar is only useful while a session is live: visibility = user
        // preference AND attached.
        function applyKeybarVisibility() {
          keybar.classList.toggle(
            "show",
            keybarEnabled && approved && activeId !== null
          );
          scrollFab.classList.toggle("show", approved && activeId !== null);
        }
        // Act on pointerdown + preventDefault so a tap never blurs xterm's hidden
        // textarea (which would dismiss an open soft keyboard).
        Array.prototype.forEach.call(
          keybar.querySelectorAll("button[data-key]"),
          function (btn) {
            var seq = seqForKey(btn.getAttribute("data-key"));
            btn.addEventListener("pointerdown", function (e) {
              e.preventDefault();
              sendKey(seq);
            });
          }
        );
        // Scroll buttons move the LOCAL mirror viewport through xterm's scrollback
        // (a page at a time) — they review output above the fold and never send
        // anything to the PTY. preventDefault keeps xterm's hidden textarea focus
        // intact so an open soft keyboard isn't dismissed mid-scroll.
        function scrollMirror(dir) {
          if (!term) return;
          try {
            if (typeof term.scrollPages === "function") term.scrollPages(dir);
            else if (typeof term.scrollLines === "function")
              term.scrollLines(dir * Math.max(1, (term.rows || 24) - 1));
          } catch (e) {}
        }
        Array.prototype.forEach.call(
          scrollFab.querySelectorAll("button[data-scroll]"),
          function (btn) {
            var dir = btn.getAttribute("data-scroll") === "up" ? -1 : 1;
            btn.addEventListener("pointerdown", function (e) {
              e.preventDefault();
              scrollMirror(dir);
            });
          }
        );
        function refreshKbToggle() {
          kbToggle.classList.toggle("on", keybarEnabled);
          kbToggle.setAttribute("aria-pressed", keybarEnabled ? "true" : "false");
        }
        kbToggle.addEventListener("click", function () {
          keybarEnabled = !keybarEnabled;
          saveKeybarPref(keybarEnabled);
          refreshKbToggle();
          applyKeybarVisibility();
          onViewportChange();
        });
        refreshKbToggle();

        // ---- websocket -------------------------------------------------------
        function send(obj) {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
        }

        function connect() {
          if (!TOKEN) {
            setDot("error");
            showOverlay({
              spinner: false,
              title: "Missing access token",
              text: "Open this page by scanning the QR code shown in Genisys.",
            });
            return;
          }
          approved = false;
          activeId = null;
          attaching = false;
          sessions = [];
          tabbar.style.display = "none";
          applyKeybarVisibility();
          setDot("pending");
          // A stored grant means we expect to be auto-approved on reconnect, so
          // show a neutral "Connecting…" rather than "Waiting for approval".
          var grant = loadGrant();
          showOverlay(
            grant
              ? {
                  spinner: true,
                  title: "Connecting…",
                  text: "Reconnecting to your terminal.",
                }
              : {
                  spinner: true,
                  title: "Waiting for approval",
                  text: "Allow this device on the Genisys desktop to continue.",
                }
          );

          var proto = location.protocol === "https:" ? "wss" : "ws";
          var wsUrl =
            proto + "://" + location.host + "/ws?token=" + encodeURIComponent(TOKEN);
          if (grant) wsUrl += "&grant=" + encodeURIComponent(grant);
          ws = new WebSocket(wsUrl);

          ws.onmessage = function (ev) {
            var msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            handle(msg);
          };
          ws.onclose = function () {
            var wasApproved = approved;
            approved = false;
            activeId = null;
            tabbar.style.display = "none";
            applyKeybarVisibility();
            setDot("error");
            showOverlay({
              spinner: false,
              title: wasApproved ? "Disconnected" : "Connection closed",
              text: wasApproved
                ? "The connection to Genisys was closed."
                : "Could not reach the Genisys terminal.",
              action: { label: "Reconnect", onClick: connect },
            });
          };
          ws.onerror = function () {
            /* surfaced via onclose */
          };
        }

        function handle(msg) {
          switch (msg.type) {
            case "pending":
              setDot("pending");
              showOverlay({
                spinner: true,
                title: "Waiting for approval",
                text: "Allow this device on the Genisys desktop to continue.",
              });
              break;
            case "denied":
              // A stored grant that gets denied is stale/revoked — drop it so the
              // next attempt does a fresh approval request instead of replaying it.
              clearGrant();
              setDot("error");
              showOverlay({
                spinner: false,
                title: "Access denied",
                text: msg.reason || "The desktop did not approve this device.",
                action: { label: "Try again", onClick: connect },
              });
              break;
            case "granted":
              // Server issued / refreshed our trust grant — persist it so the next
              // page reload skips the approval prompt until it expires.
              if (msg.grant) saveGrant(msg.grant, msg.expiresAt);
              break;
            case "sessions":
              approved = true;
              sessions = msg.sessions || [];
              renderTabs();
              // First time in (or after the active tab went away): auto-attach.
              if (activeId === null && !attaching) {
                if (sessions.length) {
                  attaching = true;
                  ensureTerminal();
                  switchTo(sessions[0].id);
                } else if (perms.allowNewTab) {
                  attaching = true;
                  ensureTerminal();
                  newShell();
                } else {
                  // No shared tabs and the host disallows opening new shells.
                  setDot("pending");
                  showOverlay({
                    spinner: false,
                    title: "No terminals shared",
                    text: "Open a tab on the desktop, or ask the host to allow new tabs.",
                  });
                }
              }
              break;
            case "permissions":
              perms.allowNewTab = !!msg.allowNewTab;
              perms.allowCloseTab = !!msg.allowCloseTab;
              renderTabs();
              break;
            case "attached":
              approved = true;
              attaching = false;
              activeId = msg.sessionId;
              setDot("live");
              meta.textContent = msg.mode === "mirror" ? "mirroring" : "shell";
              hideOverlay();
              ensureTerminal();
              term.reset();
              doFit();
              // Don't steal focus into xterm's textarea on touch devices — that
              // pops the mobile soft keyboard every time a tab attaches (switch /
              // new shell / reconnect). Phone users open the keyboard deliberately
              // by tapping the terminal surface; on-screen keys send input without
              // focus. Desktop browsers still auto-focus for immediate typing.
              if (!isTouch) term.focus();
              renderTabs();
              applyKeybarVisibility();
              var attachedDims = dims();
              send({ type: "resize", cols: attachedDims.cols, rows: attachedDims.rows });
              break;
            case "output":
              if (term && msg.data) term.write(fromB64(msg.data));
              break;
            case "session_exit":
              if (msg.sessionId === activeId) {
                activeId = null;
                attaching = false;
                if (term) term.reset();
                setDot("pending");
                renderTabs();
                applyKeybarVisibility();
              }
              break;
            case "error":
              if (!approved) {
                setDot("error");
                showOverlay({
                  spinner: false,
                  title: "Something went wrong",
                  text: msg.message || "Unexpected error.",
                  action: { label: "Try again", onClick: connect },
                });
              } else {
                attaching = false;
                renderTabs();
              }
              break;
          }
        }

        // ---- responsive resize ----------------------------------------------
        function onViewportChange() {
          if (!activeId || !term) return;
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            doFit();
            var d = dims();
            send({ type: "resize", cols: d.cols, rows: d.rows });
          }, 120);
        }
        window.addEventListener("resize", onViewportChange);
        window.addEventListener("orientationchange", onViewportChange);
        if (window.ResizeObserver) {
          new ResizeObserver(onViewportChange).observe(
            document.getElementById("terminal-wrap")
          );
        }
        // Keep the app inside the visual viewport so the key bar floats above the
        // mobile soft keyboard instead of being hidden behind it.
        function syncAppHeight() {
          var vv = window.visualViewport;
          if (!vv) return;
          if (window.innerHeight - vv.height > 120) {
            app.style.height = Math.round(vv.height) + "px";
            app.style.bottom = "auto";
            app.style.transform = vv.offsetTop
              ? "translateY(" + Math.round(vv.offsetTop) + "px)"
              : "";
          } else {
            app.style.height = "";
            app.style.bottom = "";
            app.style.transform = "";
          }
        }
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            syncAppHeight();
            onViewportChange();
          });
          window.visualViewport.addEventListener("scroll", syncAppHeight);
        }
        // Tapping the terminal surface focuses it so the mobile keyboard opens.
        document.getElementById("terminal-wrap").addEventListener("click", function () {
          if (activeId && term) term.focus();
        });

        if (!TerminalCtor) {
          setDot("error");
          showOverlay({
            spinner: false,
            title: "Failed to load terminal",
            text: "The terminal engine could not be loaded.",
          });
          return;
        }
        connect();
      })();
    </script>
  </body>
</html>
