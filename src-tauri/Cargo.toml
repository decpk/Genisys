[package]
name = "genisys"
version = "1.0.0"
description = "Genisys — Developer Operating System"
authors = ["Genisys Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
fuzzy-matcher = "0.3"
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
image = "0.25"
chrono = "0.4"
dirs = "6"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# Bundle several shared files into one archive for QuickShare "Zip & send" /
# "Download as zip". default-features off → just Stored + Deflated (no bzip2/zstd).
zip = { version = "2", default-features = false, features = ["deflate"] }
open = "5"
tauri-plugin-store = "2.4.2"
tauri-plugin-notification = "2"
regex = "1"
glob = "0.3"
scraper = "0.22"
url = "2"
plist = "1"
trash = "5"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
clipboard-rs = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
whisper-rs = "0.16"
sherpa-onnx = "1.12.40"
portable-pty = "0.8"
ignore = "0.4"
sha2 = "0.10"
notify = "6"
notify-debouncer-mini = "0.4"
# Messages app — P2P E2E-encrypted LAN messaging
snow = "0.9"
mdns-sd = "0.11"
hex = "0.4"
keepawake = "0.6.0"
enigo = "0.3.0"

# macOS-only: native AVFoundation camera/microphone permission pre-flight so the
# TCC prompt fires deterministically and Genisys registers in System Settings.
# Pinned to the objc2 0.6 generation already pulled in transitively by wry/tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
block2 = "0.6"
# Build the `kAXTrustedCheckOptionPrompt` options dictionary for the native
# Accessibility permission prompt in `commands::accessibility`.
core-foundation = "0.10"
# Enable HTML5 element/video fullscreen (e.g. the YouTube fullscreen button) in
# WKWebView. wry gates the private `fullScreenEnabled` WKPreferences key — which
# WKWebView requires before it will honour `Element.requestFullscreen()` — behind
# its `fullscreen` feature, and the key must be set at webview-creation time.
# This is the same wry already resolved transitively via tauri-runtime-wry
# (0.54.x), so Cargo feature-unification simply turns the flag on for every
# webview the app creates (e.g. the main window) without changing
# versions or pulling in any extra crates (`fullscreen = []`).
wry = { version = "0.54", features = ["fullscreen"] }
