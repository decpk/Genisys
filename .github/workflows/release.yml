name: Release

# Trigger: push a version tag like v1.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write # required so the action can create the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel (x86_64)
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # Linux (.deb / .AppImage / .rpm)
            args: ''
          - platform: 'windows-latest' # Windows (.msi / .exe)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Genisys ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform from the **Assets** below.

            ### 🪟 Windows
            Download `*_x64-setup.exe` (or the `.msi`) and run it.
            If SmartScreen warns "Windows protected your PC", click **More info → Run anyway**.

            ### 🍎 macOS
            - **Apple Silicon (M1/M2/M3):** download `*_aarch64.dmg`
            - **Intel:** download `*_x64.dmg`

            Open the `.dmg` and drag Genisys to Applications. On first launch macOS may say
            "Genisys can't be opened" — **right-click the app → Open**, or run once:
            ```
            xattr -cr /Applications/Genisys.app
            ```

            ### 🐧 Linux
            Use the `.AppImage` (chmod +x, then run), or install the `.deb` / `.rpm`.

            > These builds are not signed with paid certificates, so the warnings above are expected and safe to dismiss.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
